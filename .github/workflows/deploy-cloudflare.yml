name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend SPA
        run: |
          npm ci
          npm run build

      - name: Build Sendforge CLI
        run: cargo build --release

      - name: Export Static Site
        run: |
          # Convert current repository clone to bare repo with full object copy
          git clone --no-local --bare . /tmp/sendforge.git
          echo "A high-performance, static-first Git forge powered by sendfile(2) and in-browser Git resolution." > /tmp/sendforge.git/description
          git --git-dir=/tmp/sendforge.git config sendforge.name "sendforge"
          git --git-dir=/tmp/sendforge.git config sendforge.description "A high-performance, static-first Git forge powered by sendfile(2) static serving and in-browser Git resolution."
          git --git-dir=/tmp/sendforge.git config sendforge.owner "mike10010100"
          git --git-dir=/tmp/sendforge.git config sendforge.cloneUrl "https://github.com/mike10010100/sendforge.git"
          ./target/release/sendforge export /tmp/sendforge.git ./public-dist --frontend-dist ./dist

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public-dist --project-name=sendforge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cloudflare Setup Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice title=Cloudflare Deployment Skipped::To enable automatic zero-cost deployment to Cloudflare Pages, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to your GitHub Repository Secrets."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
