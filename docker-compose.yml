services:
  sendforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendforge
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount your local bare git repositories directory into the container
      - ./repositories:/var/git
    environment:
      - SENDFORGE_DIR=/var/git
      - SENDFORGE_PORT=8080
      - SENDFORGE_FRONTEND=/var/www/dist
